<!--
==========================================================================================
  BIENENSTOCK — Single-File-Simulation (HTML + CSS + JS inline, keine externen Assets)
==========================================================================================
  MODULPLAN (10 Module; jede Funktion trägt ihren Modulnamen als Kommentar)

  1. core         Konstanten (CFG) und deterministischer Zufall. Besitzt: CFG, RNG-Zustand.
  2. hexGrid      Wabengitter in axialen Koordinaten, Wachstum in Spiralreihenfolge, Zellzustände
                  samt Zählern, Pixel<->Zelle. Besitzt: grid.cells[], grid.index, counts.
  3. resourcePool Drei getrennte Ledger (Nektar-Zucker, Pollen, Wasser): Ereigniszähler
                  gesammelt/verbraucht, Entnahme aus Zellen, Wasserreserve. Besitzt: ledger, water.
  4. environment  Wetter (Markov-Kette), Blütenfelder, Außen- und Stocktemperatur,
                  Krankheits-/Räuberdruck. Besitzt: env.
  5. broodCycle   Implizite Königin legt Eier, Ei->Larve->Puppe->Biene, Larvenfütterung,
                  Brutsterben. Besitzt: queen, Brut-Statistik.
  6. beeAgents    Bienen mit genau einer Rolle (altersabhängig), Aufgaben-Automat,
                  Pfade, Honigkette 1–5, Sterblichkeit. Besitzt: bees[], handover-Warteschlange.
  7. sim          Tick-Schleife (10 Ticks/s, entkoppelt vom Render), Parameter, Stress-Test,
                  Fail-State mit Ursachenkette, Log. Besitzt: S (Gesamtzustand), tick, history.
  8. renderer     Ein Canvas 2D: Waben (Offscreen-Cache), Wiese, Bienen, Layer, Startaufbau.
                  Besitzt: camera, Frame-Zähler, Flow-Partikel.
  9. ui           HTML-Panels: Slider, Buttons, Stats, Zell-Inspektor, Log, Modals.
                  Besitzt: DOM-Referenzen.
 10. selfCheck    Invarianten S1–S6 beim Start und laufend, Status-Tabelle, Fail-Banner.
                  Besitzt: Prüfergebnisse.

  Build: Diese Datei entsteht aus src/template.html + src/js/*.js + fonts/ (build.ps1).

:root {
  --wood-0: #120a05;
  --wood-1: #1d1209;
  --wood-2: #2a1a0d;
  --wood-3: #3b2513;
  --wax:    #e9c98b;
  --wax-dim:#9c7c4c;
  --honey:  #f5a623;
  --amber:  #d9780f;
  --nectar: #ffd86b;
  --pollen: #ff5d1f;
  --cream:  #f7ead0;
  --ink:    #f2e3c6;
  --muted:  #ad926b;
  --ok:     #a8d14f;
  --fail:   #ff3b2f;
  --cool:   #4fb3d9;
  --line:   rgba(233, 201, 139, .16);
  --panel:  rgba(29, 18, 9, .82);
  --f-display: "Fraunces", serif;
  --f-mono: "SourceCode", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  color: var(--ink);
  font: 13px/1.45 var(--f-mono);
  background-color: var(--wood-0);
  background-image:
    radial-gradient(1200px 700px at 30% 40%, rgba(245,166,35,.13), transparent 60%),
    radial-gradient(900px 600px at 85% 10%, rgba(217,120,15,.10), transparent 65%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='97' viewBox='0 0 56 97'><path d='M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z M28 64 L28 97' fill='none' stroke='%23e9c98b' stroke-opacity='.045' stroke-width='1.2'/></svg>"),
    linear-gradient(160deg, var(--wood-2), var(--wood-0) 70%);
  overflow: hidden;
}
.app { display: grid; grid-template-columns: 1fr 390px; grid-template-rows: auto 1fr; height: 100vh; }
header {
  grid-column: 1 / -1; display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap;
  padding: 14px 22px 10px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(18,10,5,.9), rgba(18,10,5,.4));
}
h1 { font: 600 30px/1 var(--f-display); margin: 0; letter-spacing: .5px; color: var(--honey); }
h1 small { font: 13px var(--f-mono); color: var(--muted); letter-spacing: 0; margin-left: 10px; }
h2 { font: 600 16px/1.2 var(--f-display); margin: 0 0 8px; color: var(--wax); letter-spacing: .3px; }
.clock { font-size: 14px; color: var(--cream); }
.clock b { color: var(--honey); font-weight: 400; }
.badge { margin-left: auto; padding: 3px 10px; border-radius: 3px; border: 1px solid var(--line); }
.badge.ok { color: var(--ok); border-color: rgba(168,209,79,.4); }
.badge.fail { color: #fff; background: var(--fail); border-color: var(--fail); }
.stage { position: relative; min-width: 0; min-height: 0; }
canvas#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
.legend { position: absolute; left: 14px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px;
  padding: 7px 10px; background: rgba(18,10,5,.72); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; max-width: 60%; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 11px; height: 11px; display: inline-block; clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
aside { overflow-y: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 12px 16px 30px; }
section { padding: 12px 0 14px; border-bottom: 1px solid var(--line); }
.ctl { display: grid; grid-template-columns: 1fr 52px; align-items: center; gap: 2px 8px; margin: 6px 0; }
.ctl label { color: var(--muted); }
.ctl output { text-align: right; color: var(--cream); }
.ctl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--honey); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
button {
  font: 12px var(--f-mono); color: var(--wood-0); background: var(--wax); border: 0; border-radius: 3px;
  padding: 6px 11px; cursor: pointer; transition: background .15s, transform .1s;
}
button:hover { background: var(--honey); }
button:active { transform: translateY(1px); }
button.on { background: var(--honey); box-shadow: 0 0 0 2px rgba(245,166,35,.35); }
button.danger { background: var(--pollen); color: #fff; }
.toggles { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; color: var(--muted); }
.toggles input { accent-color: var(--honey); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
td, th { padding: 2px 4px; text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 400; }
td.n { text-align: right; color: var(--cream); font-variant-numeric: tabular-nums; }
.kpi { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
.kpi div { background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 3px; padding: 5px 7px; }
.kpi b { display: block; font: 600 20px/1.1 var(--f-display); color: var(--honey); }
.kpi span { color: var(--muted); font-size: 11px; }
.warn { color: var(--pollen); }
.note { color: var(--muted); font-size: 11px; margin-top: 6px; }
#inspector .empty { color: var(--muted); }
#log { max-height: 210px; overflow-y: auto; font-size: 11px; }
#log div { padding: 1px 0; border-bottom: 1px dotted rgba(233,201,139,.08); }
#log .t { color: var(--muted); margin-right: 6px; }
#log .bad { color: var(--pollen); }
#log .sys { color: var(--cool); }
.pass { color: var(--ok); } .failc { color: var(--fail); font-weight: 700; }
#failBanner { display: none; margin: 8px 0; padding: 8px 10px; background: var(--fail); color: #fff; border-radius: 3px; }
#failBanner.show { display: block; }
.modal { position: fixed; inset: 0; display: none; place-items: center; background: rgba(8,4,2,.72); z-index: 10; }
.modal.show { display: grid; }
.modal .box { width: min(640px, 92vw); max-height: 86vh; overflow-y: auto; background: var(--wood-1);
  border: 1px solid var(--amber); border-radius: 5px; padding: 18px 22px; box-shadow: 0 20px 70px rgba(0,0,0,.6); }
.modal h2 { font-size: 24px; color: var(--honey); }
.modal ol { padding-left: 20px; } .modal li { margin: 3px 0; }

/* Orchestrierter Aufbau: gestaffelte Reveals der Panels, Waben bauen sich im Canvas spiralförmig auf */
.rv { opacity: 0; transform: translateY(10px); animation: rv .6s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes rv { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .rv { animation: none; opacity: 1; transform: none; } }

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { grid-template-columns: 1fr; grid-template-rows: auto 62vh auto; height: auto; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .legend { max-width: 92%; }
}
</style>
</head>
<body>
<div class="app">
  <header class="rv" style="animation-delay:.05s">
    <h1>Bienenstock <small>Kolonie-Simulation</small></h1>
    <div class="clock">Tag <b id="day">0,0</b> · Tick <b id="tick">0</b> · <span id="weather">—</span> · außen <b id="tout">—</b> · Brutnest <b id="thive">—</b></div>
    <div class="badge" id="checkBadge">selfCheck …</div>
  </header>

  <div class="stage rv" style="animation-delay:.15s">
    <canvas id="view"></canvas>
    <div class="legend" id="legend"></div>
  </div>

  <aside>
    <section class="rv" style="animation-delay:.3s">
      <h2>Steuerung</h2>
      <div class="ctl"><label for="sColony">Koloniegröße (Ziel)</label><output id="oColony"></output>
        <input type="range" id="sColony" min="30" max="400" step="1" value="150"></div>
      <div class="ctl"><label for="sRes">Ressourcen / Blüten</label><output id="oRes"></output>
        <input type="range" id="sRes" min="0" max="100" step="1" value="70"></div>
      <div class="ctl"><label for="sWeather">Wetterstabilität</label><output id="oWeather"></output>
        <input type="range" id="sWeather" min="0" max="100" step="1" value="70"></div>
      <div class="ctl"><label for="sDisease">Krankheits-/Räuberdruck</label><output id="oDisease"></output>
        <input type="range" id="sDisease" min="0" max="100" step="1" value="15"></div>
      <div class="btns">
        <button id="bPause">Pause</button>
        <button id="bSpeed">2×</button>
        <button id="bReset">Reset</button>
        <button id="bStress" class="danger">Stress-Test</button>
        <button id="bReport" hidden>Bericht</button>
      </div>
      <div class="note" id="stressNote"></div>
      <div class="toggles">
        <label><input type="checkbox" id="lPaths" checked> Bienenpfade</label>
        <label><input type="checkbox" id="lTemp"> Temperaturzonen</label>
        <label><input type="checkbox" id="lFlow" checked> Ressourcenflüsse</label>
      </div>
    </section>

    <section class="rv" style="animation-delay:.42s">
      <h2>Kolonie</h2>
      <div class="kpi">
        <div><b id="kPop">0</b><span>Bienen</span></div>
        <div><b id="kHoney">0</b><span>Honig (Einh.)</span></div>
        <div><b id="kBrood">0</b><span>Brut</span></div>
      </div>
      <table id="stats"></table>
      <div class="note warn" id="capNote"></div>
    </section>

    <section class="rv" style="animation-delay:.54s">
      <h2>Zell-Inspektor</h2>
      <div id="inspector"><span class="empty">Zelle im Wabenbild anklicken.</span></div>
    </section>

    <section class="rv" style="animation-delay:.66s">
      <h2>Status · selfCheck</h2>
      <div id="failBanner"></div>
      <table id="checks"></table>
      <div class="note" id="checkNote"></div>
      <h2 style="margin-top:12px">Ausbaustufen</h2>
      <div id="stages" class="note" style="color:var(--ink)"></div>
    </section>

    <section class="rv" style="animation-delay:.78s">
      <h2>Ereignisse</h2>
      <div id="log"></div>
    </section>
  </aside>
</div>

<div class="modal" id="collapseModal"><div class="box" id="collapseBox"></div></div>
<div class="modal" id="reportModal"><div class="box" id="reportBox"></div></div>

<script>
"use strict";
// ===== 10_core.js =====
/* Design decisions
 * 1. Hex-Gitter als flaches Array in Spiralreihenfolge (axiale Koordinaten q,r) plus Map "q,r"->Index.
 *    Alternative: 2D-Offset-Array mit fester Breite. Grund: Das Gitter wächst ringweise von innen nach
 *    außen; in Spiralreihenfolge ist Wachstum ein push(), Indizes bleiben stabil (Inspektor, Reservierungen,
 *    Zielprüfung bleiben gültig), und Ring = Abstand zur Mitte ergibt die natürliche Zonierung
 *    (Brut innen, Pollenkranz, Honig außen) ohne eigene Zonen-Datenstruktur.
 * 2. Wassergehalt: Erhaltungsgröße ist der Zucker in ganzzahligen Einheiten; der Wassergehalt ist ein
 *    Prozent-Attribut der Zelle, das beim Einlagern gewichtet gemischt wird (neuer Nektar 60 %).
 *    Alternative: Nektar als Volumen, das beim Fächeln schrumpft. Grund: Die Bilanz soll mit Toleranz 0
 *    stimmen; verdunstendes Wasser ist kein Ressourcenverbrauch und würde jede Bilanz verwischen.
 * 3. Bilanz aus zwei unabhängigen Quellen: "gesammelt" und "verbraucht" sind Ereigniszähler, die nur an
 *    der Blüte bzw. am Verbrauchsort erhöht werden; "eingelagert" und "in Transit" werden in selfCheck
 *    jedes Mal neu aus Zellen und Bienenlasten gezählt. Alternative: ein Zähler "eingelagert", der beim
 *    Einlagern hochzählt. Grund: Dann prüfte die Invariante nur, ob dieselbe Zahl zweimal addiert wurde.
 * 4. Pfade ohne A*: Bienen laufen über die Wabenoberfläche (keine Hindernisse), also genügen Polylinien
 *    mit einem versetzten Zwischenpunkt. Innen- und Außenraum haben eigene Koordinatensysteme, die am
 *    Flugloch verbunden sind; so kann die Wabenkamera beim Wachsen zoomen, ohne Flugbahnen zu verzerren.
 *    Alternative: A* auf dem Zellgraphen. Grund: ohne Hindernisse liefert A* dieselbe Gerade, kostet aber
 *    bei 400 Agenten und 10 Ticks/s spürbar Rechenzeit.
 * 5. Larvenfütterung zentral pro Tick mit Pflegekapazität (Ammen x 6 + Arbeiterinnen x 1) statt
 *    Futtertransport je Biene. Alternative: jede Amme trägt Futterportionen einzeln. Grund: Die Vorgabe
 *    "Larven brauchen in jedem Tick Pollen und Nektar" ist bei 10 Ticks/s als Einzeltransport nicht
 *    darstellbar; die Kapazitätsgrenze koppelt trotzdem Ammenzahl -> Unterversorgung -> Brutsterben.
 *    Die Ammen laufen sichtbar zu den Larven und werden im Inspektor als zuständige Biene geführt.
 */

// [core] Konstanten — alle Zeitangaben in Ticks (1 Tick = 0,1 Sim-Tag)
const CFG = Object.freeze({
  TICKS_PER_SEC: 10,
  DAYS_PER_TICK: 0.1,
  MAX_STEPS_PER_FRAME: 8,
  START_CELLS: 80,
  MAX_CELLS: 1200,
  HEX: 10,                       // Zellradius in Wabenkoordinaten
  EGG_T: 30, LARVA_T: 60, PUPA_T: 120,
  LARVA_STARVE_LIMIT: 3,         // Ticks in Folge ohne Futter -> Larve stirbt
  NURSE_CAP: 6, WORKER_CAP: 1,   // Larven pro Amme / Arbeiterin und Tick
  CELL_CAP: { nectar: 100, pollen: 150 },
  LOAD: { nectar: 80, pollen: 80, water: 20 },
  NECTAR_WATER_IN: 60,           // % Wasser beim Einlagern
  HONEY_WATER: 20,               // unter diesem Wert wird Honig gedeckelt
  FAN_RATE: 1.6,                 // %-Punkte Wasser pro Fächel-Tick (bei voller Zelle langsamer)
  WAX_COST: 6,                   // Zucker pro neu gebauter Zelle
  EAT_EVERY: 20,                 // jede Biene isst 1 Einheit Zucker alle n Ticks
  AGE_WORKER: 120, AGE_FORAGER: 220, AGE_MAX: 500,
  T_TARGET: 35, T_COOL: 36, T_HEAT: 34,
  POP_MIN: 10, POP_MAX: 400,
  HISTORY: 50,
  LONG_DAYS: 30,                 // Tagesverlauf für die Vorgeschichte im Kollaps-Modal
  STRESS_TICKS: 300,
  ROLES: ["forager", "nurse", "worker"],
});
const ROLE_DE = { forager: "Sammlerin", nurse: "Brutpflege", worker: "Arbeiterin" };
const STATE_DE = { empty: "leer", egg: "Ei", larva: "Larve", pupa: "Puppe", pollen: "Pollen", nectar: "Nektar", honey: "Honig (gedeckelt)" };
const RES_DE = { nectar: "Nektar (Zucker)", pollen: "Pollen", water: "Wasser" };

// [core] deterministischer Zufallsgenerator (mulberry32)
function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rnd = makeRng(1);
// [core]
function rand(a, b) { return a + (b - a) * rnd(); }
// [core]
function randInt(a, b) { return Math.floor(rand(a, b + 1)); }
// [core]
function chance(p) { return rnd() < p; }
// [core]
function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
// [core]
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
// [core] Zahlformat deutsch
function fmt(v, d = 0) { return Number(v).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d }); }

// ===== 20_hexGrid.js =====
// [hexGrid] Richtungen im axialen System
const HEX_DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const SQ3 = Math.sqrt(3);

// [hexGrid] alle Zellkoordinaten bis maxCells in Spiralreihenfolge (Ring für Ring)
function hexSpiral(maxCells) {
  const out = [[0, 0, 0]];
  for (let k = 1; out.length < maxCells; k++) {
    let q = HEX_DIRS[4][0] * k, r = HEX_DIRS[4][1] * k;
    for (let d = 0; d < 6; d++) {
      for (let i = 0; i < k; i++) {
        out.push([q, r, k]);
        q += HEX_DIRS[d][0]; r += HEX_DIRS[d][1];
      }
    }
  }
  return out.slice(0, maxCells);
}
const SPIRAL = hexSpiral(CFG.MAX_CELLS);

// [hexGrid] axial -> Wabenkoordinaten (Spitze oben)
function hexToXY(q, r) { return { x: CFG.HEX * SQ3 * (q + r / 2), y: CFG.HEX * 1.5 * r }; }

// [hexGrid] Wabenkoordinaten -> axial (Würfel-Rundung)
function xyToHex(x, y) {
  const qf = (SQ3 / 3 * x - y / 3) / CFG.HEX, rf = (2 / 3 * y) / CFG.HEX, sf = -qf - rf;
  let q = Math.round(qf), r = Math.round(rf); const s = Math.round(sf);
  const dq = Math.abs(q - qf), dr = Math.abs(r - rf), ds = Math.abs(s - sf);
  if (dq > dr && dq > ds) q = -r - s; else if (dr > ds) r = -q - s;
  return { q, r };
}

// [hexGrid] leeres Gitter
function newGrid() { return { cells: [], index: new Map(), extent: { minX: 0, maxX: 0, minY: 0, maxY: 0 }, entrance: { x: 0, y: 0 }, capReached: false }; }

// [hexGrid] neue Zelle an der nächsten Spiralposition; false an der Obergrenze
function growCell(builderId) {
  const g = S.grid;
  if (g.cells.length >= CFG.MAX_CELLS) {
    if (!g.capReached) { g.capReached = true; logEvent("Wabengitter hat die Obergrenze von 1.200 Zellen erreicht — kein weiteres Wachstum.", "sys"); }
    return false;
  }
  const [q, r, ring] = SPIRAL[g.cells.length];
  const p = hexToXY(q, r);
  const c = {
    id: g.cells.length, q, r, ring, x: p.x, y: p.y,
    state: "empty", amount: 0, water: 0, since: S.tick,
    wasNectar: false, fanTicks: 0, starve: 0,
    bee: builderId ?? null, reservedBy: null, fanner: null, built: S.tick,
  };
  g.cells.push(c);
  g.index.set(q + "," + r, c.id);
  S.counts.empty++;
  const e = g.extent;
  e.minX = Math.min(e.minX, p.x - CFG.HEX); e.maxX = Math.max(e.maxX, p.x + CFG.HEX);
  e.minY = Math.min(e.minY, p.y - CFG.HEX); e.maxY = Math.max(e.maxY, p.y + CFG.HEX);
  g.entrance = { x: e.maxX + CFG.HEX * 1.6, y: e.maxY * 0.45 };
  S.dirty = true;
  return true;
}

// [hexGrid] Zelle an Wabenkoordinate oder null
function cellAt(x, y) {
  const h = xyToHex(x, y);
  const id = S.grid.index.get(h.q + "," + h.r);
  return id === undefined ? null : S.grid.cells[id];
}

// [hexGrid] einzige Stelle, die Zellzustände ändert — führt die Zähler mit und bewacht die Honigkette
function setCellState(c, state) {
  if (c.state === state) return true;
  if (state === "honey" && !(c.state === "nectar" && c.wasNectar && c.fanTicks > 0 && c.water < CFG.HONEY_WATER)) {
    S.honeyGuardHits++;
    logEvent(`FEHLER: Zelle #${c.id} sollte ohne Nektarphase zu Honig werden — blockiert.`, "bad");
    return false;
  }
  S.counts[c.state]--;
  S.counts[state]++;
  c.state = state;
  c.since = S.tick;
  if (state === "empty") { c.amount = 0; c.water = 0; c.wasNectar = false; c.fanTicks = 0; c.starve = 0; c.fanner = null; c.bee = null; }
  if (state === "nectar") { c.wasNectar = true; }
  S.dirty = true;
  return true;
}

// [hexGrid] beste Zelle nach Bewertungsfunktion (kleinster Wert), ohne Reservierung
function bestCell(filter, score) {
  let best = null, bs = Infinity;
  for (const c of S.grid.cells) {
    if (c.reservedBy !== null || !filter(c)) continue;
    const s = score(c) + rnd() * 0.8;
    if (s < bs) { bs = s; best = c; }
  }
  return best;
}

// [hexGrid] Radius des Brutnests: feste 55 % des aktuellen Wabenradius (Brut innen, Pollenkranz, Honig außen).
// Nicht aus der äußersten Brutzelle abgeleitet — eine einzelne verirrte Brutzelle würde sonst die Zone aufblähen.
function broodRadius() {
  const cells = S.grid.cells, maxRing = cells.length ? cells[cells.length - 1].ring : 1;
  let rNeed = 1;                                   // kleinster Ring, innerhalb dessen ~0,6 × Zielgröße Zellen liegen
  while (1 + 3 * rNeed * (rNeed + 1) < S.params.colony * 0.6) rNeed++;
  return Math.max(2, Math.min(maxRing - 1, Math.max(Math.floor(maxRing * 0.55), rNeed)));
}

// [hexGrid] Anteil freier, unreservierter Zellen
function freeCellCount() {
  let n = 0;
  for (const c of S.grid.cells) if (c.state === "empty" && c.reservedBy === null) n++;
  return n;
}

// ===== 30_resourcePool.js =====
// [resourcePool] drei getrennte Ledger; nur Ereigniszähler, Bestände werden gezählt, nie mitgeführt
function newLedger() {
  const l = () => ({ collected: 0, consumed: 0, byCat: {} });
  return { nectar: l(), pollen: l(), water: l() };
}

// [resourcePool] Eingang einer Ressource (an der Blüte, an der Quelle oder als Anfangsbestand)
function poolCollect(res, n, cat = "Sammelflug") {
  if (n <= 0) return;
  const L = S.ledger[res];
  L.collected += n;
  L.byCat["+" + cat] = (L.byCat["+" + cat] || 0) + n;
  if (S.stress.active) S.stress.collected[res] += n;
}

// [resourcePool] endgültiger Verbrauch mit Kategorie
function poolConsume(res, n, cat) {
  if (n <= 0) return;
  const L = S.ledger[res];
  L.consumed += n;
  L.byCat[cat] = (L.byCat[cat] || 0) + n;
}

// [resourcePool] Bestandslisten einmal pro Tick (Entnahme ohne Vollscan je Biene)
function rebuildStoreLists() {
  const n = [], h = [], p = [];
  for (const c of S.grid.cells) {
    if (c.amount <= 0) continue;
    if (c.state === "nectar") n.push(c); else if (c.state === "honey") h.push(c); else if (c.state === "pollen") p.push(c);
  }
  S.stores = { nectar: n, honey: h, pollen: p };
  const sum = a => a.reduce((s, c) => s + c.amount, 0);
  S.storeTotals = { nectar: sum(n), honey: sum(h), pollen: sum(p), water: S.water };
}

// [resourcePool] entnimmt bis zu n Einheiten aus Zellen bzw. Reserve und verbucht sie als Verbrauch
function withdraw(res, n, cat) {
  let need = n;
  if (res === "water") {
    const t = Math.min(need, S.water); S.water -= t; poolConsume("water", t, cat); return t;
  }
  const lists = res === "nectar" ? [S.stores.nectar, S.stores.honey] : [S.stores.pollen];
  for (const list of lists) {
    for (let i = 0; i < list.length && need > 0; i++) {        // innen zuerst: räumt das Brutnest frei
      const c = list[i];
      // Liste stammt vom Tickanfang: Zelle kann inzwischen geleert und mit anderem Inhalt befüllt sein
      const okState = res === "nectar" ? (c.state === "nectar" || c.state === "honey") : c.state === "pollen";
      if (!okState || c.amount <= 0) continue;
      const t = Math.min(need, c.amount);
      c.amount -= t; need -= t; S.dirty = true;
      if (c.amount === 0) {
        if (c.reservedBy !== null) releaseReservation(c);
        setCellState(c, "empty");
      }
    }
    if (need === 0) break;
  }
  const taken = n - need;
  poolConsume(res, taken, cat);
  return taken;
}

// [resourcePool] Bestand aus Zellen gezählt (für Entscheidungen und selfCheck)
function storedAmount(res) {
  if (res === "water") return S.water;
  let s = 0;
  for (const c of S.grid.cells) {
    if (res === "nectar" && (c.state === "nectar" || c.state === "honey")) s += c.amount;
    else if (res === "pollen" && c.state === "pollen") s += c.amount;
  }
  return s;
}

// [resourcePool] Honigvorrat = Zucker in gedeckelten bzw. reifen Honigzellen
function honeyStock() {
  let s = 0;
  for (const c of S.grid.cells) if (c.state === "honey") s += c.amount;
  return s;
}

// [resourcePool] Last in Transit (Bienen unterwegs, Übergabe, Einlagerung)
function transitAmount(res) {
  let s = 0;
  for (const b of S.bees) if (b.load && b.load.res === res) s += b.load.n;
  return s;
}

// [resourcePool] Reservierung einer Zielzelle lösen
function releaseReservation(c) {
  const b = S.beeById.get(c.reservedBy);
  if (b && b.target && b.target.kind === "cell" && b.target.id === c.id) b.target.reserved = false;
  c.reservedBy = null;
}

// ===== 40_environment.js =====
// [environment] Anfangszustand der Umwelt; Wiese in Außenkoordinaten (u nach rechts ab Flugloch, v vertikal)
function newEnv() {
  return {
    weather: "Sonne", tOut: 24, tOutTarget: 24, tHive: 34.6,
    heaters: 0, coolers: 0,
    patches: [
      { id: 0, kind: "flower", name: "Linde",       u: 470, v: -300, nectar: 500, pollen: 250, maxN: 840, maxP: 400, phase: 0.00, hue: 48 },
      { id: 1, kind: "flower", name: "Weißklee",    u: 760, v: -110, nectar: 400, pollen: 300, maxN: 600, maxP: 500, phase: 0.30, hue: 0 },
      { id: 2, kind: "flower", name: "Raps",        u: 560, v: 170,  nectar: 600, pollen: 350, maxN: 920, maxP: 560, phase: 0.55, hue: 55 },
      { id: 3, kind: "flower", name: "Wildblumen",  u: 900, v: 300,  nectar: 300, pollen: 400, maxN: 520, maxP: 640, phase: 0.80, hue: 300 },
      { id: 4, kind: "water",  name: "Tränke",      u: 250, v: 330,  nectar: 0,   pollen: 0,   maxN: 0,   maxP: 0,   phase: 0, hue: 200 },
    ],
  };
}

// [environment] Wahrscheinlichkeit eines Wetterwechsels pro Sim-Tag, abhängig vom aktuellen Wetter:
// Stabilität hält gutes Wetter fest und beendet Regen schnell (vorher galt sie für jedes Wetter gleich —
// bei 70 % hielten Regenphasen dadurch bis zu 24 Tage und verursachten alle gemessenen Kollapse).
function weatherChangeProb(state = S.env.weather) {
  const st = S.params.weather / 100;
  return state === "Regen" ? 0.15 + 0.35 * st : 0.04 + (1 - st) * 0.46;
}

// [environment] Nachwachsrate der Blüten (Summe Nektar pro Tick) — Funktion der Slider
function flowerRegen(p) {
  const res = S.params.res / 100;
  const wf = S.env.weather === "Sonne" ? 1 : S.env.weather === "Bewölkt" ? 0.55 : 0.15;
  const bloom = 0.55 + 0.45 * Math.sin(2 * Math.PI * (S.tick * CFG.DAYS_PER_TICK / 40 + p.phase));
  return 0.04 * res * wf * bloom;
}

// [environment] Sterbewahrscheinlichkeit je Tick durch Krankheit/Räuber (Alterstod separat in beesStep)
function mortalityPerTick(b) {
  const d = S.params.disease / 100;
  let p = 0.00025 + d * 0.0024;
  if (b.space === "out") p += d * 0.0012;      // Räuber draußen
  return p;
}

// [environment] Flugwetter?
function canFly() { return S.env.weather !== "Regen"; }

// [environment] ein Tick Umwelt: Wetter, Außentemperatur, Blüten, Stocktemperatur
function envStep() {
  const E = S.env, st = S.params.weather / 100;
  if (S.tick % 10 === 0 && chance(weatherChangeProb())) {
    const w = { Sonne: 0.25 + 0.55 * st, "Bewölkt": 0.35, Regen: Math.max(0.05, 0.4 - 0.35 * st) };
    let x = rnd() * (w.Sonne + w["Bewölkt"] + w.Regen), nw = "Sonne";
    if ((x -= w.Sonne) > 0) nw = (x -= w["Bewölkt"]) > 0 ? "Regen" : "Bewölkt";
    const base = nw === "Sonne" ? 27 : nw === "Bewölkt" ? 21 : 15;
    E.tOutTarget = base + (1 - st) * rand(-9, 9);
    if (nw !== E.weather) { E.weather = nw; logEvent(`Wetter: ${nw}, außen → ${fmt(E.tOutTarget, 1)} °C`, "sys"); }
  }
  E.tOut += (E.tOutTarget - E.tOut) * 0.05;
  for (const p of E.patches) {
    if (p.kind !== "flower") continue;
    const r = flowerRegen(p);
    p.nectar = Math.min(p.maxN, p.nectar + p.maxN * r);
    p.pollen = Math.min(p.maxP, p.pollen + p.maxP * r);
  }
  const passive = E.tOut + 0.045 * Math.min(S.bees.length, CFG.POP_MAX);
  E.tHive += 0.03 * (passive - E.tHive) + E.heaters * 0.05 - E.coolers * 0.05;
  E.tHive = clamp(E.tHive, -5, 50);
}

// [environment] lokale Temperatur einer Zelle (Brutnest warm, Rand nähert sich der Außentemperatur)
function cellTemp(c, br, maxRing) {
  const f = clamp((c.ring - br) / (maxRing - br + 2), 0, 1);
  return S.env.tHive - (S.env.tHive - S.env.tOut) * f * 0.6;
}

// ===== 50_broodCycle.js =====
// [broodCycle] Zustand der impliziten Königin
function newQueen() { return { acc: 0, laid: 0, noCellLogged: false }; }

// [broodCycle] Legerate (Eier pro Tick) aus Zielgröße, Vorräten und Temperatur
function layingRate() {
  const target = S.params.colony, pop = S.bees.length;
  const brood = S.counts.egg + S.counts.larva + S.counts.pupa;
  if (pop + brood >= CFG.POP_MAX) return 0;
  // weiche Regelung: Brut zählt als künftige Bienen (Gleichgewicht: Brut ≈ 0,47 × Ziel); kein harter Stopp,
  // denn ein Legestopp wirkt erst 21 Tage später und lässt kleine Völker durch die Untergrenze schwingen
  const ratio = (pop + brood) / (target * 1.47);
  let rate = target / 380 * clamp(1 + (1 - ratio) * 3, 0.15, 2);
  const sugar = S.storeTotals.nectar + S.storeTotals.honey, pollen = S.storeTotals.pollen;
  const food = clamp(Math.min(sugar / 350, pollen / 100), 0, 1);
  if (pollen < 20 || sugar < 40) return 0;
  if (S.env.tHive < 32) rate *= 0.3;
  return rate * food;
}

// [broodCycle] Eiablage in die innerste freie Zelle
function queenLay() {
  const Q = S.queen;
  Q.acc += layingRate();
  while (Q.acc >= 1) {
    Q.acc -= 1;
    const br = broodRadius();
    const c = bestCell(c => c.state === "empty" && c.ring <= br + 1, c => c.ring * 2 + (c.ring > br ? 40 : 0))
           || bestCell(c => c.state === "empty", c => c.ring * 2);           // Notfall: Brutnest voll

    if (!c) {
      if (!Q.noCellLogged) { Q.noCellLogged = true; logEvent("Königin findet keine freie Zelle für Eier.", "bad"); }
      Q.acc = 0; return;
    }
    Q.noCellLogged = false;
    setCellState(c, "egg");
    c.bee = null; Q.laid++;
  }
}

// [broodCycle] Entwicklung Ei 30 -> Larve 60 -> Puppe 120 -> Biene; Temperaturschäden
function advanceBrood() {
  const dev = Math.abs(S.env.tHive - CFG.T_TARGET);
  const pTemp = dev > 3 ? 0.0015 * (dev - 3) : 0;
  let tempDead = 0;
  for (const c of S.grid.cells) {
    if (c.state !== "egg" && c.state !== "larva" && c.state !== "pupa") continue;
    if (pTemp > 0 && chance(pTemp)) { killBrood(c, "Temperatur"); tempDead++; continue; }
    const age = S.tick - c.since;
    if (c.state === "egg" && age >= CFG.EGG_T) { setCellState(c, "larva"); c.starve = 0; }
    else if (c.state === "larva" && age >= CFG.LARVA_T) setCellState(c, "pupa");
    else if (c.state === "pupa" && age >= CFG.PUPA_T) {
      setCellState(c, "empty");
      spawnBee(0, c.x, c.y);
      S.stats.births++;
    }
  }
  if (tempDead) logEvent(`${tempDead} Brutzelle(n) durch Stocktemperatur ${fmt(S.env.tHive, 1)} °C abgestorben.`, "bad");
}

// [broodCycle] Brutzelle stirbt ab
function killBrood(c, cause) {
  setCellState(c, "empty");
  S.stats.broodDeaths[cause] = (S.stats.broodDeaths[cause] || 0) + 1;
  S.window.push({ tick: S.tick, kind: "brood", cause });
}

// [broodCycle] Fütterung: jede Larve braucht je Tick 1 Zucker + 1 Pollen, alle 5 Ticks 1 Wasser zur Verdünnung
function feedLarvae() {
  const larvae = [];
  for (const c of S.grid.cells) if (c.state === "larva") larvae.push(c);
  if (!larvae.length) return;
  const nurses = S.bees.filter(b => b.role === "nurse");
  const workers = S.roleCount.worker;
  const cap = nurses.length * CFG.NURSE_CAP + workers * CFG.WORKER_CAP;
  larvae.sort((a, b) => b.starve - a.starve);
  const dead = {};
  larvae.forEach((c, i) => {
    let reason = null;
    if (i >= cap) reason = "keine Pflegebiene frei";
    else {
      const s = withdraw("nectar", 1, "Larvenfutter");
      const p = withdraw("pollen", 1, "Larvenfutter");
      if ((S.tick + c.id) % 5 === 0 && withdraw("water", 1, "Futterverdünnung") === 0) withdraw("nectar", 1, "Verdünnung ohne Wasser");
      if (!s) reason = "Nektar fehlte"; else if (!p) reason = "Pollen fehlte";
      if (nurses.length) c.bee = nurses[i % nurses.length].id;
    }
    if (reason) {
      c.starve++;
      if (c.starve >= CFG.LARVA_STARVE_LIMIT) { (dead[reason] = dead[reason] || []).push(c.id); killBrood(c, "Unterversorgung: " + reason); }
    } else c.starve = 0;
  });
  for (const r in dead) logEvent(`${dead[r].length} Larve(n) gestorben — ${r} (Zelle ${dead[r].slice(0, 5).map(i => "#" + i).join(", ")}${dead[r].length > 5 ? " …" : ""}).`, "bad");
}

// [broodCycle] ein Tick Brut
function broodStep() { queenLay(); advanceBrood(); feedLarvae(); }

// ===== 60_beeAgents.js =====
// [beeAgents] Rolle aus dem Alter; die Altersgrenzen verschieben sich mit dem Bedarf des Volks
function roleForAge(age) {
  const a = S.roleAges || { w: CFG.AGE_WORKER, f: CFG.AGE_FORAGER };
  return age < a.w ? "nurse" : age < a.f ? "worker" : "forager";
}

// [beeAgents] Bedarfsanpassung der Altersgrenzen (Ammen bleiben länger / Sammeln früher), weich nachgeführt
function updateRoleAges() {
  const a = S.roleAges || (S.roleAges = { w: CFG.AGE_WORKER, f: CFG.AGE_FORAGER });
  const rc = S.roleCount, pop = Math.max(1, S.bees.length);
  const wT = rc.nurse * CFG.NURSE_CAP < S.counts.larva * 1.2 ? CFG.AGE_WORKER + 60 : rc.nurse > pop * 0.4 ? CFG.AGE_WORKER - 40 : CFG.AGE_WORKER;
  const fT = rc.forager < pop * 0.3 ? CFG.AGE_FORAGER - 70 : rc.forager > pop * 0.55 ? CFG.AGE_FORAGER + 60 : CFG.AGE_FORAGER;
  a.w += (wT - a.w) * 0.02; a.f += (Math.max(fT, a.w + 30) - a.f) * 0.02;
}

// [beeAgents] neue Biene im Stock
function spawnBee(age, x, y) {
  const b = {
    id: S.nextBeeId++, age, role: roleForAge(age), task: "idle", timer: 0,
    x, y, space: "hive", px: x, py: y, pspace: "hive", path: [],
    target: { kind: "rest", x, y }, load: null, want: null, waitT: 0, hunger: 0, dead: false,
    wobble: rnd() * 6.28,
  };
  S.bees.push(b); S.beeById.set(b.id, b);
  return b;
}

// [beeAgents] Wegpunkte; Innen- und Außenraum sind am Flugloch verbunden (Design decision 4)
function wp(x, y, space) { return { x, y, space }; }
// [beeAgents] versetzter Zwischenpunkt, damit Pfade nicht schnurgerade sind
function midPoint(a, b, space, k = 0.18) {
  const dx = b.x - a.x, dy = b.y - a.y, s = (rnd() - 0.5) * 2 * k;
  return wp((a.x + b.x) / 2 - dy * s, (a.y + b.y) / 2 + dx * s, space);
}
// [beeAgents] Pfad von der aktuellen Position zu dest
function pathTo(b, dest) {
  const Ein = wp(S.grid.entrance.x, S.grid.entrance.y, "hive"), Eout = wp(0, 0, "out");
  const here = wp(b.x, b.y, b.space), p = [];
  if (b.space === dest.space) p.push(midPoint(here, dest, dest.space), dest);
  else if (b.space === "hive") p.push(midPoint(here, Ein, "hive"), Ein, Eout, midPoint(Eout, dest, "out", 0.25), dest);
  else p.push(midPoint(here, Eout, "out", 0.25), Eout, Ein, midPoint(Ein, dest, "hive"), dest);
  b.path = p;
}
// [beeAgents] Bewegung entlang des Pfads; true, wenn angekommen
function moveBee(b) {
  b.px = b.x; b.py = b.y; b.pspace = b.space;
  let budget = b.space === "out" ? 55 : 12;
  while (budget > 0 && b.path.length) {
    const w = b.path[0];
    if (w.space !== b.space) { b.space = w.space; b.x = w.x; b.y = w.y; b.path.shift(); budget = w.space === "out" ? 55 : 12; continue; }
    const dx = w.x - b.x, dy = w.y - b.y, d = Math.hypot(dx, dy);
    if (d <= budget) { b.x = w.x; b.y = w.y; b.path.shift(); budget -= d; }
    else { b.x += dx / d * budget; b.y += dy / d * budget; budget = 0; }
  }
  return b.path.length === 0;
}
// [beeAgents] Zielkoordinate einer Zelle
function cellWp(c) { return wp(c.x + rand(-2, 2), c.y + rand(-2, 2), "hive"); }
// [beeAgents] Ziel setzen und loslaufen
function goTo(b, task, target, dest) { b.task = task; b.target = target; b.timer = 0; pathTo(b, dest); }

// [beeAgents] Ruhen auf einer zufälligen Zelle (optional nahe dem Flugloch)
function goRest(b, nearEntrance) {
  const cells = S.grid.cells;
  let c = pick(cells);
  if (nearEntrance) c = bestCell(() => true, x => Math.hypot(x.x - S.grid.entrance.x, x.y - S.grid.entrance.y) / 20) || c;
  goTo(b, "toRest", { kind: "cell", id: c.id }, cellWp(c));
}

// [beeAgents] Ressourcenfluss für den Layer merken
function addFlow(res, from, to) {
  if (S.flows.length > 260) S.flows.shift();
  S.flows.push({ res, from, to, born: S.tick });
}

// ---------------------------------------------------------------- Sammlerin (Honigkette Schritt 1–2)
// [beeAgents] Sammlerin entscheidet: was holen, wohin fliegen
function decideForager(b) {
  if (!canFly()) { goRest(b, true); return; }
  const E = S.env, T = S.storeTotals;
  const larvae = S.counts.larva;
  let res = "nectar";
  const needWater = (E.tHive > CFG.T_COOL - 0.6 && S.water < 120) || S.water < 30;
  // Reichweite beider Vorräte in Ticks; der knappere wird proportional häufiger angeflogen
  const pCover = T.pollen / (larvae + 5);
  const sCover = (T.nectar + T.honey) / (larvae + S.bees.length / CFG.EAT_EVERY + 5);
  const pPollen = clamp(sCover / (sCover + pCover + 1e-9), 0.15, 0.85);
  // volle Lager und kaum freie Zellen: weniger Ausflüge (verhindert ein honigverstopftes Brutnest)
  const full = Math.min(pCover, sCover) / 500 + (freeCellCount() < 6 ? 0.5 : 0);
  if (rnd() < clamp(full, 0, 0.9)) { goRest(b, true); return; }
  const r = rnd();
  if (needWater && r < 0.3) res = "water";
  else if (rnd() < pPollen) res = "pollen";
  let patch;
  if (res === "water") patch = E.patches[4];
  else {
    const fl = E.patches.filter(p => p.kind === "flower");
    const tot = fl.reduce((s, p) => s + p[res] + 1, 0);
    let x = rnd() * tot; patch = fl[0];
    for (const p of fl) { x -= p[res] + 1; if (x <= 0) { patch = p; break; } }
  }
  b.want = res;
  goTo(b, "outbound", { kind: "patch", id: patch.id }, wp(patch.u + rand(-40, 40), patch.v + rand(-30, 30), "out"));
}

// [beeAgents] an der Blüte: Nektar/Pollen/Wasser laden (Schritt 1) und zurück zum Eingang (Schritt 2)
function gather(b) {
  const p = S.env.patches[b.target.id], res = b.want;
  let n = CFG.LOAD[res];
  if (res !== "water") { n = Math.min(n, Math.floor(p[res])); p[res] -= n; }
  S.stats.trips++;
  if (n > 0) {
    b.load = { res, n };
    poolCollect(res, n, "Sammelflug");
    S.stats.tripsOk++; S.stats.tripUnits += n;
    addFlow(res, wp(p.u, p.v, "out"), wp(0, 0, "out"));
  }
  goTo(b, "inbound", { kind: "entrance" }, wp(S.grid.entrance.x - 6, S.grid.entrance.y + rand(-6, 6), "hive"));
}

// [beeAgents] Sammlerin am Eingang angekommen
function foragerArrived(b) {
  if (!b.load) { b.task = "idle"; return; }
  const res = b.load.res;
  if (res === "nectar") {                    // Schritt 2: Übergabe an eine Stockbiene
    b.task = "handover"; b.waitT = 0; b.target = { kind: "entrance" };
    S.handover.push(b.id);
  } else if (res === "water") {
    S.water += b.load.n; S.stats.delivered.water += b.load.n;
    addFlow("water", wp(S.grid.entrance.x, S.grid.entrance.y, "hive"), wp(0, 0, "hive"));
    b.load = null; b.task = "idle";
  } else storeLoad(b, "pollen");
}

// ---------------------------------------------------------------- Einlagern (Schritt 3)
// [beeAgents] passende Zelle für Pollen (Kranz um die Brut) oder Nektar (außen) wählen und reservieren
function chooseStoreCell(res) {
  const br = broodRadius(), CAP = CFG.CELL_CAP[res];
  if (res === "pollen")
    return bestCell(c => (c.state === "pollen" && c.amount < CAP) || c.state === "empty",
      c => Math.abs(c.ring - (br + 1)) * 3 + (c.state === "empty" ? 2 : 0) - (c.state === "pollen" ? c.amount / CAP : 0) + (c.state === "empty" && c.ring <= br ? 60 : 0));
  // Brutnest-Zellen nur als Notlösung (hoher Malus), sonst blockiert ein Brutnest bis zum Rand die Einlagerung
  return bestCell(c => (c.state === "nectar" && c.amount < CAP) || c.state === "empty",
    c => -c.ring * 2 + (c.state === "empty" ? 3 : 0) - (c.state === "nectar" ? c.amount / CAP * 3 : 0) + (c.state === "empty" && c.ring <= br ? 60 : 0));
}

// [beeAgents] Last zu einer Zelle tragen
function storeLoad(b, res) {
  const c = chooseStoreCell(res);
  if (!c) {
    // kein Platz: mit Nektar im Honigmagen selbst Wachs bauen (Wachs aus der eigenen Last), sonst warten
    const n = S.grid.cells.length;
    if (res === "nectar" && b.load.n >= CFG.WAX_COST && n < CFG.MAX_CELLS && countTask("build", "toBuild") < 8) {
      const [q, r] = SPIRAL[n], p = hexToXY(q, r);
      goTo(b, "toBuild", { kind: "site", x: p.x, y: p.y }, wp(p.x, p.y, "hive")); return;
    }
    b.task = "holdLoad"; b.timer = 10; b.target = { kind: "entrance" }; return;
  }
  c.reservedBy = b.id;
  goTo(b, "deposit", { kind: "cell", id: c.id, reserved: true }, cellWp(c));
}

// [beeAgents] Einlagerung in die Zielzelle; Nektar kommt mit ~60 % Wasser hinein
function depositAt(b) {
  const c = S.grid.cells[b.target.id];
  if (c.reservedBy === b.id) c.reservedBy = null;
  if (!b.load) { b.task = "idle"; return; }                 // Last unterwegs aufgefressen
  const res = b.load.res, CAP = CFG.CELL_CAP[res];
  const ok = c.state === "empty" || (c.state === res && c.amount < CAP);
  if (ok) {
    const add = Math.min(b.load.n, CAP - c.amount);
    if (c.state === "empty") setCellState(c, res);
    if (res === "nectar") c.water = (c.water * c.amount + CFG.NECTAR_WATER_IN * add) / (c.amount + add);
    c.amount += add; b.load.n -= add; c.bee = b.id; S.dirty = true;
    addFlow(res, wp(S.grid.entrance.x, S.grid.entrance.y, "hive"), wp(c.x, c.y, "hive"));
    if (res !== "water") S.stats.delivered[res] += add;
  }
  if (b.load.n === 0) { b.load = null; b.task = "idle"; }
  else storeLoad(b, res);
}

// ---------------------------------------------------------------- Stockbienen
// [beeAgents] wartende Sammlerin ohne Abholerin finden (Ammen erst nach 40 Ticks Wartezeit)
function claimHandover(b) {
  for (const fid of S.handover) {
    if (S.claims.has(fid)) continue;
    const f = S.beeById.get(fid);
    if (!f || f.task !== "handover") continue;
    if (b.role === "nurse" && f.waitT < 40) continue;
    S.claims.set(fid, b.id);
    goTo(b, "toReceive", { kind: "bee", id: fid }, wp(f.x - 4, f.y + rand(-4, 4), "hive"));
    return true;
  }
  return false;
}

// [beeAgents] Übergabe Sammlerin -> Stockbiene (Schritt 2), dann Einlagerung (Schritt 3)
function receive(b) {
  const fid = b.target.id, f = S.beeById.get(fid);
  S.claims.delete(fid);
  if (!f || f.dead || f.task !== "handover" || !f.load) { b.task = "idle"; return; }
  b.load = f.load; f.load = null; f.task = "idle";
  S.handover = S.handover.filter(id => id !== fid);
  storeLoad(b, "nectar");
}

// [beeAgents] Anzahl Bienen in einer Aufgabe
function countTask(...tasks) { let n = 0; for (const b of S.bees) if (tasks.includes(b.task)) n++; return n; }

// [beeAgents] Arbeiterin wählt nach Priorität: Abholen, Kühlen, Heizen, Fächeln, Bauen, Ruhen
function decideWorker(b) {
  if (claimHandover(b)) return;
  const E = S.env, br = broodRadius();
  const broodCell = () => bestCell(c => c.ring <= br, () => 0) || S.grid.cells[0];
  if (E.tHive > CFG.T_COOL && S.water > 0 && countTask("cool", "toCool") < Math.ceil((E.tHive - CFG.T_TARGET) * 4)) {
    const c = broodCell(); goTo(b, "toCool", { kind: "cell", id: c.id }, cellWp(c)); return;
  }
  if (E.tHive < CFG.T_HEAT && countTask("heat", "toHeat") < Math.ceil((CFG.T_TARGET - E.tHive) * 5)) {
    const c = broodCell(); goTo(b, "toHeat", { kind: "cell", id: c.id }, cellWp(c)); return;
  }
  // Bauen vor Fächeln, sobald Zellen knapp werden — sonst verstopft Nektar das Brutnest
  const cells = S.grid.cells.length;
  const waiting = S.handover.length + countTask("holdLoad");
  if (!S.grid.capReached && cells < CFG.MAX_CELLS && (freeCellCount() < Math.max(12, cells * 0.18) || waiting > 2)
      && S.storeTotals.nectar + S.storeTotals.honey > CFG.WAX_COST * 4 && countTask("build", "toBuild") < 5) {
    const [q, r] = SPIRAL[cells], p = hexToXY(q, r);
    goTo(b, "toBuild", { kind: "site", x: p.x, y: p.y }, wp(p.x, p.y, "hive")); return;
  }
  const fanCell = bestCell(c => c.state === "nectar" && c.fanner === null && c.water >= CFG.HONEY_WATER, c => -c.amount / 10);
  if (fanCell) {                              // Schritt 4: Fächeln
    fanCell.fanner = b.id;
    goTo(b, "toFan", { kind: "cell", id: fanCell.id }, cellWp(fanCell)); return;
  }
  if (cells >= CFG.MAX_CELLS && !S.grid.capReached) growCell(b.id);
  goRest(b, false);
}

// [beeAgents] Amme: Larven versorgen (Ziel = hungrigste Larve), sonst Brut kontrollieren
function decideNurse(b) {
  if (claimHandover(b)) return;
  const E = S.env;
  if (E.tHive < CFG.T_HEAT && countTask("heat", "toHeat") < Math.ceil((CFG.T_TARGET - E.tHive) * 5)) {   // Brut wärmen
    const br = broodRadius(), h = bestCell(c => c.ring <= br, () => 0) || S.grid.cells[0];
    goTo(b, "toHeat", { kind: "cell", id: h.id }, cellWp(h)); return;
  }
  const c = bestCell(c => c.state === "larva", c => -c.starve * 5)
         || bestCell(c => c.state === "egg" || c.state === "pupa", () => 0);
  if (c) { goTo(b, "toTend", { kind: "cell", id: c.id }, cellWp(c)); return; }
  goRest(b, false);
}

// [beeAgents] Arbeitsschritt einer laufenden Aufgabe (pro Tick)
function work(b) {
  const c = b.target.kind === "cell" ? S.grid.cells[b.target.id] : null;
  switch (b.task) {
    case "fan": {
      if (!c || c.state !== "nectar") { b.timer = 0; break; }
      c.water = Math.max(0, c.water - CFG.FAN_RATE * (1.3 - 0.5 * c.amount / CFG.CELL_CAP.nectar));
      c.fanTicks++; c.bee = b.id; S.dirty = true;
      if (c.water < CFG.HONEY_WATER) {          // Schritt 5: reif -> Honig, gedeckelt
        if (setCellState(c, "honey")) { S.stats.ripened++; c.fanner = null; }
        b.timer = 0;
      }
      break;
    }
    case "cool":
      if (S.env.tHive <= CFG.T_TARGET) { b.timer = 0; break; }
      if ((S.tick + b.id) % 3 === 0 && withdraw("water", 1, "Kühlung") === 0) { b.timer = 0; break; }
      S.env.coolersNext++; break;
    case "heat":
      if (S.env.tHive >= CFG.T_TARGET) { b.timer = 0; break; }
      if ((S.tick + b.id) % 6 === 0) withdraw("nectar", 1, "Heizen");
      S.env.heatersNext++; break;
    case "tend":
      if (c && c.state === "larva") c.bee = b.id;
      break;
  }
}

// [beeAgents] Aufgabe beendet
function finishTask(b) {
  if (b.task === "fan") {
    const c = S.grid.cells[b.target.id];
    if (c && c.fanner === b.id) c.fanner = null;
  }
  const room = S.grid.cells.length < CFG.MAX_CELLS;
  if (b.task === "build" && room && b.load && b.load.res === "nectar" && b.load.n >= CFG.WAX_COST) {
    b.load.n -= CFG.WAX_COST; poolConsume("nectar", CFG.WAX_COST, "Wachsbau");
    if (b.load.n === 0) b.load = null;
    growCell(b.id);
  } else if (b.task === "build" && room) {
    if (S.storeTotals.nectar + S.storeTotals.honey >= CFG.WAX_COST) {
      const t = withdraw("nectar", CFG.WAX_COST, "Wachsbau");
      if (t === CFG.WAX_COST) growCell(b.id);
    }
  }
  if (b.task === "holdLoad" && b.load) { storeLoad(b, b.load.res); return; }
  if (b.task === "gather") { gather(b); return; }
  b.task = "idle";
}

// [beeAgents] Ankunft am Pfadende
function arrive(b) {
  const timed = { toFan: ["fan", 16], toCool: ["cool", 14], toHeat: ["heat", 16], toBuild: ["build", 14], toTend: ["tend", 8], toRest: ["rest", 8], outbound: ["gather", 6] };
  if (timed[b.task]) {
    const [t, d] = timed[b.task];
    b.task = t; b.timer = (t === "gather" && S.env.weather === "Bewölkt") ? 9 : d;
    return;
  }
  if (b.task === "inbound") foragerArrived(b);
  else if (b.task === "toReceive") receive(b);
  else if (b.task === "deposit") depositAt(b);
}

// [beeAgents] Tod oder Entnahme einer Biene; Last wird als verloren verbucht, Referenzen gelöst
function removeBee(b, cause, natural = true) {
  if (b.dead) return;
  b.dead = true;
  if (b.load) { poolConsume(b.load.res, b.load.n, "verloren (" + cause + ")"); b.load = null; }
  if (b.target && b.target.kind === "cell") {
    const c = S.grid.cells[b.target.id];
    if (c && c.reservedBy === b.id) c.reservedBy = null;
    if (c && c.fanner === b.id) c.fanner = null;
  }
  S.handover = S.handover.filter(id => id !== b.id);
  for (const [fid, rid] of S.claims) {
    if (fid === b.id) {
      const r = S.beeById.get(rid);
      if (r && !r.dead) { r.task = "idle"; r.path = []; r.target = { kind: "rest", x: r.x, y: r.y }; }
      S.claims.delete(fid);
    }
    else if (rid === b.id) S.claims.delete(fid);
  }
  S.beeById.delete(b.id);
  if (natural) {
    S.stats.deaths[cause] = (S.stats.deaths[cause] || 0) + 1;
    S.window.push({ tick: S.tick, kind: "bee", cause });
  }
}

// [beeAgents] ein Tick für alle Bienen
function beesStep() {
  S.env.heatersNext = 0; S.env.coolersNext = 0;
  updateRoleAges();
  for (const b of S.bees) {
    if (b.dead) continue;
    b.age++;
    if (chance(mortalityPerTick(b))) { removeBee(b, b.space === "out" ? "Räuber/Krankheit" : "Krankheit"); continue; }
    // Alterstod am Ende eines Arbeitsgangs (untätig, ohne Last) — nicht mitten im Transport
    if (b.age > CFG.AGE_MAX && b.task === "idle" && !b.load && chance(0.3)) { removeBee(b, "Alter"); continue; }
    if (b.space === "hive" && (S.tick + b.id) % CFG.EAT_EVERY === 0) {
      if (b.load && b.load.res === "nectar" && b.load.n > 0) {      // frisst aus der eigenen Last
        b.load.n--; poolConsume("nectar", 1, "Ernährung Bienen"); b.hunger = 0;
        if (b.load.n === 0) {
          b.load = null;
          if (b.task === "handover") { b.task = "idle"; S.handover = S.handover.filter(id => id !== b.id); }
        }
      } else if (withdraw("nectar", 1, "Ernährung Bienen") === 0) { if (++b.hunger >= 4) { removeBee(b, "Hunger"); continue; } }
      else b.hunger = 0;
    }
    if (b.task === "idle" && !b.load) b.role = roleForAge(b.age);
    if (b.task === "handover") { b.waitT++; b.px = b.x; b.py = b.y; b.pspace = b.space; continue; }
    const arrived = moveBee(b);
    if (b.timer > 0) { if (arrived) { work(b); if (--b.timer <= 0) finishTask(b); } continue; }
    if (arrived && b.task !== "idle") arrive(b);
    if (b.task === "idle") {
      if (b.load) { storeLoad(b, b.load.res); continue; }
      if (b.role === "forager") decideForager(b);
      else if (b.role === "worker") decideWorker(b);
      else decideNurse(b);
    }
  }
  if (S.bees.some(b => b.dead)) S.bees = S.bees.filter(b => !b.dead);
  S.env.heaters = S.env.heatersNext; S.env.coolers = S.env.coolersNext;
  const rc = { forager: 0, nurse: 0, worker: 0 };
  for (const b of S.bees) rc[b.role]++;
  S.roleCount = rc;
}

// ===== 70_sim.js =====
// [sim] Gesamtzustand
let S = null;

// [sim] frischen Zustand anlegen; Parameter und Layer kommen aus der UI
function createState(seed, params, layers) {
  rnd = makeRng(seed);
  S = {
    seed, tick: 0, speed: 1, paused: false, collapsed: false, frames: 0, startedAt: performance.now(),
    params: { ...params }, layers: { ...layers },
    grid: newGrid(),
    counts: { empty: 0, egg: 0, larva: 0, pupa: 0, pollen: 0, nectar: 0, honey: 0 },
    ledger: newLedger(), water: 0,
    stores: { nectar: [], honey: [], pollen: [] }, storeTotals: { nectar: 0, honey: 0, pollen: 0, water: 0 },
    env: newEnv(), queen: newQueen(),
    bees: [], beeById: new Map(), nextBeeId: 1, roleCount: { forager: 0, nurse: 0, worker: 0 },
    handover: [], claims: new Map(), flows: [],
    log: [], history: [], window: [], days: [], dayAcc: null,
    stats: { births: 0, deaths: {}, broodDeaths: {}, trips: 0, tripsOk: 0, tripUnits: 0, delivered: { nectar: 0, pollen: 0, water: 0 }, ripened: 0 },
    stress: { active: false, collected: { nectar: 0, pollen: 0, water: 0 } },
    honeyGuardHits: 0, selected: null, dirty: true, revealT0: performance.now(),
  };
  seedColony();
  rebuildStoreLists();
  logEvent(`Kolonie angelegt: ${S.bees.length} Bienen, ${S.grid.cells.length} Zellen, Seed ${seed}.`, "sys");
}

// [sim] Startbestand: Brutnest innen, Pollenkranz, unreifer Nektar außen (noch KEIN Honig)
function seedColony() {
  for (let i = 0; i < CFG.START_CELLS; i++) growCell(null);
  for (const c of S.grid.cells) {
    if (c.ring <= 3 && chance(0.9)) {
      const st = pick(["egg", "larva", "larva", "pupa", "pupa", "pupa"]);
      setCellState(c, st);
      c.since = -randInt(0, (st === "egg" ? CFG.EGG_T : st === "larva" ? CFG.LARVA_T : CFG.PUPA_T) - 1);
    } else if (c.ring === 4 && chance(0.6)) {
      setCellState(c, "pollen"); c.amount = randInt(30, 55); poolCollect("pollen", c.amount, "Anfangsbestand");
    } else if (c.ring >= 5 && chance(0.9)) {
      setCellState(c, "nectar"); c.amount = randInt(75, 100); c.water = rand(21, 50);
      poolCollect("nectar", c.amount, "Anfangsbestand");
    }
  }
  S.water = 80; poolCollect("water", 80, "Anfangsbestand");
  for (let i = 0; i < S.params.colony; i++) { const c = pick(S.grid.cells); spawnBee(Math.floor(420 * Math.pow(rnd(), 1.5)), c.x, c.y); }
  const rc = { forager: 0, nurse: 0, worker: 0 };
  for (const b of S.bees) rc[b.role]++;
  S.roleCount = rc;
}

// [sim] Ereignis ins Log
function logEvent(text, kind = "") {
  S.log.push({ tick: S.tick, text, kind });
  if (S.log.length > 400) S.log.shift();
  S.logDirty = true;
}

// [sim] ein Logik-Tick in fester Reihenfolge
function simTick() {
  if (S.paused || S.collapsed) return false;
  S.tick++;
  envStep();
  rebuildStoreLists();
  broodStep();
  beesStep();
  rebuildStoreLists();
  recordHistory();
  checkFail();
  stressStep();
  if (S.tick % 20 === 0) runInvariants();
  return true;
}

// [sim] Kennzahlen der letzten 50 Ticks für die Ursachenkette
function recordHistory() {
  S.history.push({
    tick: S.tick, pop: S.bees.length, brood: S.counts.egg + S.counts.larva + S.counts.pupa,
    larva: S.counts.larva, honey: S.storeTotals.honey, nectar: S.storeTotals.nectar, pollen: S.storeTotals.pollen,
    water: S.water, tHive: S.env.tHive, weather: S.env.weather, foragers: S.roleCount.forager, nurses: S.roleCount.nurse,
  });
  if (S.history.length > CFG.HISTORY) S.history.shift();
  while (S.window.length && S.window[0].tick <= S.tick - CFG.HISTORY) S.window.shift();
  recordDay();
}

// [sim] Tagesverlauf (1 Eintrag pro Sim-Tag, 30 Tage): Vorgeschichte, die das 50-Tick-Fenster nicht sieht
function recordDay() {
  const A = S.dayAcc || (S.dayAcc = { rain: 0, c0: S.ledger.nectar.collected, k0: S.ledger.nectar.consumed, hunger0: S.stats.deaths.Hunger || 0 });
  if (S.env.weather === "Regen") A.rain++;
  if (S.tick % 10 !== 0) return;
  const L = S.ledger.nectar;
  S.days.push({
    day: S.tick / 10, pop: S.bees.length, brood: S.counts.egg + S.counts.larva + S.counts.pupa,
    sugar: S.storeTotals.honey + S.storeTotals.nectar, pollen: S.storeTotals.pollen,
    rain: A.rain / 10, sugarIn: L.collected - A.c0, sugarOut: L.consumed - A.k0,
    hunger: (S.stats.deaths.Hunger || 0) - A.hunger0, params: { ...S.params }, stress: S.stress.active,
  });
  if (S.days.length > CFG.LONG_DAYS) S.days.shift();
  S.dayAcc = null;
}

// [sim] Vorgeschichte aus dem Tagesverlauf: wann begann der Abstieg, wie lange regnete es, was wurde verstellt
function longTrend() {
  const D = S.days;
  if (D.length < 2) return [];
  const out = [], first = D[0], last = D[D.length - 1];
  const maxBy = k => D.reduce((m, d) => d[k] > m[k] ? d : m, D[0]);
  const pk = maxBy("pop"), sk = maxBy("sugar");
  out.push(`Bienen: Höchststand ${pk.pop} an Tag ${fmt(pk.day)} → ${last.pop} an Tag ${fmt(last.day)}.`);
  let z = D.length; while (z > 0 && D[z - 1].sugar === 0) z--;
  out.push(`Zuckervorrat: Höchststand ${fmt(sk.sugar)} an Tag ${fmt(sk.day)}` + (z < D.length ? `; leer seit Tag ${fmt(D[z].day)} (${D.length - z} Tage).` : `; zuletzt ${fmt(last.sugar)}.`));
  const inSum = D.reduce((s, d) => s + d.sugarIn, 0), outSum = D.reduce((s, d) => s + d.sugarOut, 0);
  out.push(`Zuckerbilanz der ${D.length} Tage: +${fmt(inSum / D.length)} gesammelt / −${fmt(outSum / D.length)} verbraucht pro Tag.`);
  const rainDays = D.filter(d => d.rain >= 0.5);
  let best = 0, cur = 0, end = null;
  D.forEach(d => { cur = d.rain >= 0.5 ? cur + 1 : 0; if (cur > best) { best = cur; end = d.day; } });
  out.push(`Regen an ${rainDays.length} von ${D.length} Tagen` + (best ? `; längste Serie ${best} Tage (bis Tag ${fmt(end)}).` : "."));
  const P = last.params;
  out.push(`Einstellungen zuletzt: Kolonie ${P.colony}, Ressourcen ${P.res} %, Wetterstabilität ${P.weather} %, Krankheit ${P.disease} %` +
    `; zu Beginn des Zeitraums: ${first.params.res} % / ${first.params.weather} % / ${first.params.disease} %.`);
  const changed = ["colony", "res", "weather", "disease"].filter(k => D.some(d => d.params[k] !== first.params[k]));
  if (changed.length) out.push(`Slider verändert im Zeitraum: ${changed.join(", ")}` + (D.some(d => d.stress) ? " (Stress-Test aktiv)." : "."));
  const hunger = D.reduce((s, d) => s + d.hunger, 0);
  if (hunger) out.push(`Verhungerte Bienen im Zeitraum: ${hunger}.`);
  return out;
}

// [sim] Fail-State prüfen
function checkFail() {
  const pop = S.bees.length, brood = S.counts.egg + S.counts.larva + S.counts.pupa, honey = honeyStock();
  let reason = null;
  if (pop < CFG.POP_MIN) reason = `Population ${pop} < ${CFG.POP_MIN}`;
  else if (brood === 0 && honey === 0) reason = `Brut 0 bei leerem Honigvorrat (Honig ${honey})`;
  if (!reason) return;
  S.collapsed = true;
  logEvent("KOLONIE KOLLABIERT: " + reason, "bad");
  const chain = causalChain(reason);
  showCollapse(reason, chain);
  if (S.stress.active) finishStress(true);
}

// [sim] Ursachenkette aus History und Ereignisfenster der letzten 50 Ticks, zeitlich geordnet
function causalChain(reason) {
  const H = S.history, first = H[0], last = H[H.length - 1], out = [];
  const add = (tick, text) => out.push({ tick, text });
  const rain = H.filter(h => h.weather === "Regen");
  if (rain.length >= 5) add(rain[0].tick, `Regen in ${rain.length} von ${H.length} Ticks — keine Sammelflüge, kein Nachschub.`);
  const hot = H.filter(h => Math.abs(h.tHive - CFG.T_TARGET) > 3);
  if (hot.length) add(hot[0].tick, `Brutnest außerhalb 32–38 °C in ${hot.length} Ticks (${fmt(Math.min(...hot.map(h => h.tHive)), 1)}–${fmt(Math.max(...hot.map(h => h.tHive)), 1)} °C).`);
  const noPollen = H.find(h => h.pollen === 0);
  if (noPollen) add(noPollen.tick, "Pollenvorrat erschöpft.");
  const noSugar = H.find(h => h.honey + h.nectar === 0);
  if (noSugar) add(noSugar.tick, "Nektar- und Honigvorrat erschöpft.");
  else if (first.honey + first.nectar > last.honey + last.nectar) add(first.tick, `Zuckervorrat sinkt: ${fmt(first.honey + first.nectar)} → ${fmt(last.honey + last.nectar)} Einheiten.`);
  const groups = {};
  for (const e of S.window) {
    const k = (e.kind === "brood" ? "Brut: " : "Bienen: ") + e.cause;
    if (!groups[k]) groups[k] = { tick: e.tick, n: 0 };
    groups[k].n++;
  }
  for (const k in groups) add(groups[k].tick, `${k} — ${groups[k].n} Todesfälle.`);
  if (first.foragers > last.foragers) add(first.tick, `Sammlerinnen: ${first.foragers} → ${last.foragers}; Ammen: ${first.nurses} → ${last.nurses}.`);
  add(last.tick, `Population ${first.pop} → ${last.pop}, Brut ${first.brood} → ${last.brood}.`);
  out.sort((a, b) => a.tick - b.tick);
  out.push({ tick: S.tick, text: "Auslöser: " + reason });
  return { items: out, first, last, long: longTrend(), days: S.days.slice() };
}

// [sim] Parameter setzen (live, ohne Reset)
function setParam(name, value) {
  S.params[name] = value;
  if (name === "colony") applyColonyTarget(false);
}

// [sim] Koloniegröße: Imker setzt Bienen zu bzw. entnimmt Bienen ohne Last (Ableger)
function applyColonyTarget(log) {
  const target = S.params.colony, pop = S.bees.length;
  if (target > pop) {
    const n = Math.min(target, CFG.POP_MAX) - pop;
    for (let i = 0; i < n; i++) { const c = pick(S.grid.cells); spawnBee(randInt(0, 300), c.x, c.y); }
    if (log && n) logEvent(`Imker setzt ${n} Bienen zu (Ziel ${target}).`, "sys");
  } else if (target < pop) {
    const cand = S.bees.filter(b => !b.load && b.task !== "handover" && !S.claims.has(b.id) && b.space === "hive");
    let n = pop - target;
    for (let i = 0; i < cand.length && n > 0; i++, n--) removeBee(cand[i], "entnommen", false);
    S.bees = S.bees.filter(b => !b.dead);
    if (log) logEvent(`Ableger entnommen: ${pop - S.bees.length} Bienen (Ziel ${target}).`, "sys");
  }
  const rc = { forager: 0, nurse: 0, worker: 0 };
  for (const b of S.bees) rc[b.role]++;
  S.roleCount = rc;
}

// [sim] Stress-Test starten: Wetter 10 %, Blüten 10 %, Krankheit 80 % für 30 Sim-Tage
function startStress() {
  const deaths0 = Object.values(S.stats.deaths).reduce((a, b) => a + b, 0);
  S.stress = {
    active: true, start: S.tick, end: S.tick + CFG.STRESS_TICKS, prev: { ...S.params },
    honey0: honeyStock(), sugar0: S.storeTotals.nectar + S.storeTotals.honey, pop0: S.bees.length,
    brood0: S.counts.egg + S.counts.larva + S.counts.pupa, deaths0, births0: S.stats.births,
    broodDeaths0: Object.values(S.stats.broodDeaths).reduce((a, b) => a + b, 0),
    collected: { nectar: 0, pollen: 0, water: 0 },
  };
  setParam("weather", 10); setParam("res", 10); setParam("disease", 80);
  syncSliders();
  logEvent("Stress-Test gestartet: Wetter 10 %, Blüten 10 %, Krankheit 80 % für 30 Sim-Tage.", "bad");
}

// [sim] Stress-Test überwachen
function stressStep() { if (S.stress.active && S.tick >= S.stress.end) finishStress(false); }

// [sim] Stress-Test beenden (regulär, durch Kollaps oder Abbruch) und Report bilden
function finishStress(collapsed, aborted = false) {
  const st = S.stress;
  const deaths = Object.values(S.stats.deaths).reduce((a, b) => a + b, 0) - st.deaths0;
  const births = S.stats.births - st.births0;
  const broodDeaths = Object.values(S.stats.broodDeaths).reduce((a, b) => a + b, 0) - st.broodDeaths0;
  const honey1 = honeyStock(), sugar1 = S.storeTotals.nectar + S.storeTotals.honey;
  const rep = {
    result: aborted ? "abgebrochen" : collapsed ? "kollabiert" : "überlebt",
    days: (S.tick - st.start) * CFG.DAYS_PER_TICK,
    honey0: st.honey0, honey1, sugar0: st.sugar0, sugar1,
    pop0: st.pop0, pop1: S.bees.length, brood0: st.brood0, brood1: S.counts.egg + S.counts.larva + S.counts.pupa,
    deaths, births, broodDeaths, mortality: deaths / Math.max(1, st.pop0 + births) * 100,
    collected: { ...st.collected },
  };
  st.active = false;
  for (const k of ["weather", "res", "disease"]) S.params[k] = st.prev[k];
  syncSliders();
  logEvent(`Stress-Test ${rep.result} nach ${fmt(rep.days, 1)} Sim-Tagen.`, rep.result === "überlebt" ? "sys" : "bad");
  if (!aborted) showReport(rep);
  return rep;
}

let loopAcc = 0, loopLast = 0;
// [sim] Hauptschleife: feste Logik-Ticks, entkoppelt vom requestAnimationFrame
function frameLoop(now) {
  const dt = Math.min(0.25, (now - loopLast) / 1000); loopLast = now;
  if (!S.paused && !S.collapsed) {
    loopAcc += dt * CFG.TICKS_PER_SEC * S.speed;
    let steps = 0;
    while (loopAcc >= 1 && steps < CFG.MAX_STEPS_PER_FRAME) { simTick(); loopAcc -= 1; steps++; }
    if (steps >= CFG.MAX_STEPS_PER_FRAME) loopAcc = 0;
  } else loopAcc = 0;
  S.frames++;
  render(clamp(loopAcc, 0, 1));
  uiFrame(now);
  requestAnimationFrame(frameLoop);
}

// [sim] Start: Zustand, UI, Startprüfung (UI-Test auf Wegwerfzustand), dann Uhr
function boot() {
  initUI();
  createState(20261016, readParams(), readLayers());
  initRenderer();
  runStartupCheck();
  loopLast = performance.now();
  requestAnimationFrame(frameLoop);
}

// ===== 80_renderer.js =====
// [renderer] Zustand der Darstellung
const R = { cv: null, ctx: null, comb: null, cctx: null, w: 0, h: 0, dpr: 1, cam: { s: 0, cx: 0, cy: 0 }, camKey: "", lastComb: -1 };
const CELL_COL = {
  empty: "#3a2614", egg: "#d6dde0", larva: "#f6e6bc", pupa: "#9a6431",
  pollen: "#ff5d1f", nectar: "#ffe189", honey: "#f5a623",
};
const RES_COL = { nectar: "#ffd86b", pollen: "#ff5d1f", water: "#4fb3d9" };
const ROLE_COL = { forager: "#ffb347", nurse: "#f7ead0", worker: "#c58a3c" };

// [renderer] Canvas einrichten
function initRenderer() {
  R.cv = document.getElementById("view");
  R.ctx = R.cv.getContext("2d");
  R.comb = document.createElement("canvas");
  R.cctx = R.comb.getContext("2d");
  resizeCanvas();
  window.addEventListener("resize", resizeCanvas);
  R.cv.addEventListener("click", onCanvasClick);
}

// [renderer] Größe an Container und Pixeldichte anpassen
function resizeCanvas() {
  const r = R.cv.getBoundingClientRect();
  R.dpr = Math.min(2, window.devicePixelRatio || 1);
  R.w = Math.max(200, r.width); R.h = Math.max(200, r.height);
  for (const c of [R.cv, R.comb]) { c.width = Math.round(R.w * R.dpr); c.height = Math.round(R.h * R.dpr); }
  R.camKey = ""; if (S) S.dirty = true;
}

// [renderer] Wabenkamera: aktuelles Gitter in die linke Bildhälfte einpassen (weich nachgeführt)
function updateCamera() {
  const e = S.grid.extent, regionW = R.w * (R.w < 700 ? 0.6 : 0.66);
  const ex0 = e.minX - 14, ex1 = S.grid.entrance.x + 10, ey0 = e.minY - 14, ey1 = e.maxY + 14;
  const target = Math.min((regionW - 30) / (ex1 - ex0), (R.h - 90) / (ey1 - ey0), 5);
  const c = R.cam;
  if (!c.s) c.s = target;
  c.s += (target - c.s) * 0.08;
  c.cx = 24 + (regionW - 30 - (ex1 - ex0) * c.s) / 2 - ex0 * c.s;
  c.cy = R.h / 2 - (ey0 + ey1) / 2 * c.s - 8;
  const key = c.s.toFixed(3) + "|" + R.w + "|" + R.h;
  if (key !== R.camKey) { R.camKey = key; S.dirty = true; }
}

// [renderer] Welt -> Bildschirm (Innenraum über Kamera, Außenraum ab dem Flugloch)
function toScreen(x, y, space) {
  const c = R.cam;
  if (space === "hive") return [c.cx + x * c.s, c.cy + y * c.s];
  const E = toScreen(S.grid.entrance.x, S.grid.entrance.y, "hive");
  const so = Math.min((R.w - E[0] - 26) / 1000, (R.h / 2 - 34) / 380);
  return [E[0] + 14 + x * so, E[1] + y * so];
}

// [renderer] Bildschirm -> Wabenkoordinate
function fromScreen(px, py) { return { x: (px - R.cam.cx) / R.cam.s, y: (py - R.cam.cy) / R.cam.s }; }

// [renderer] Sechseck-Pfad
function hexPath(g, x, y, r) {
  g.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 180 * (60 * i - 30);
    i ? g.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)) : g.moveTo(x + r * Math.cos(a), y + r * Math.sin(a));
  }
  g.closePath();
}

// [renderer] Farbe zwischen zwei RGB-Tripeln
function mix(a, b, t) { return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",")})`; }

// [renderer] Temperatur -> Farbe (kühl blau, Ziel bernstein, heiß rot)
function tempColor(t) {
  if (t < CFG.T_TARGET) return mix([79, 179, 217], [245, 166, 35], clamp((t - 26) / (CFG.T_TARGET - 26), 0, 1));
  return mix([245, 166, 35], [255, 40, 30], clamp((t - CFG.T_TARGET) / 5, 0, 1));
}

// [renderer] Waben in den Offscreen-Cache zeichnen (nur bei Änderung oder während des Aufbaus)
function drawComb(reveal) {
  const g = R.cctx, s = R.cam.s, cells = S.grid.cells;
  g.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
  g.clearRect(0, 0, R.w, R.h);
  // Rahmen (Holz) um das Gitter
  const e = S.grid.extent, [x0, y0] = toScreen(e.minX - 12, e.minY - 12, "hive"), [x1, y1] = toScreen(S.grid.entrance.x, e.maxY + 12, "hive");
  g.fillStyle = "rgba(10,6,3,.55)"; g.strokeStyle = "#5a3a1c"; g.lineWidth = 3;
  g.beginPath(); g.roundRect(x0, y0, x1 - x0, y1 - y0, 8); g.fill(); g.stroke();
  const r = CFG.HEX * s * 0.93, small = r < 4.5;
  const br = broodRadius(), maxRing = cells.length ? cells[cells.length - 1].ring : 1;
  const n = Math.floor(cells.length * reveal);
  for (let i = 0; i < n; i++) {
    const c = cells[i], [x, y] = toScreen(c.x, c.y, "hive");
    const grow = reveal < 1 ? clamp((reveal * cells.length - i) / 6, 0, 1) : 1;
    const rr = r * grow;
    hexPath(g, x, y, rr);
    g.fillStyle = c.state === "nectar" || c.state === "pollen" ? "#3f2812" : CELL_COL[c.state];
    if (c.state === "honey") g.fillStyle = "#e8961c";
    g.fill();
    if (!small) { g.strokeStyle = "rgba(233,201,139,.22)"; g.lineWidth = 1; g.stroke(); }
    if (c.state === "nectar") {
      const f = Math.sqrt(c.amount / CFG.CELL_CAP.nectar);
      hexPath(g, x, y, rr * (0.35 + 0.6 * f));
      g.fillStyle = mix([255, 244, 196], [255, 190, 50], clamp((CFG.NECTAR_WATER_IN - c.water) / (CFG.NECTAR_WATER_IN - CFG.HONEY_WATER), 0, 1));
      g.fill();
    } else if (c.state === "pollen") {
      hexPath(g, x, y, rr * (0.35 + 0.6 * Math.sqrt(c.amount / CFG.CELL_CAP.pollen)));
      g.fillStyle = CELL_COL.pollen; g.fill();
    } else if (c.state === "honey" && !small) {
      hexPath(g, x, y, rr * 0.72); g.fillStyle = "#f6c45a"; g.fill();
      g.fillStyle = "rgba(255,255,255,.25)"; g.beginPath(); g.arc(x - rr * 0.25, y - rr * 0.25, rr * 0.18, 0, 7); g.fill();
    } else if (c.state === "pupa" && !small) {
      hexPath(g, x, y, rr * 0.7); g.fillStyle = "#b9824a"; g.fill();
    } else if (c.state === "egg" && !small) {
      hexPath(g, x, y, rr); g.fillStyle = "#2b1b0d"; g.fill();
      g.fillStyle = "#f4f1e8"; g.beginPath(); g.ellipse(x, y, rr * 0.16, rr * 0.36, 0.5, 0, 7); g.fill();
    } else if (c.state === "larva" && !small) {
      hexPath(g, x, y, rr); g.fillStyle = "#2b1b0d"; g.fill();
      const k = 0.3 + 0.35 * clamp((S.tick - c.since) / CFG.LARVA_T, 0, 1);
      g.strokeStyle = c.starve ? "#ff8a5c" : "#fbefcf"; g.lineWidth = Math.max(1, rr * 0.28); g.lineCap = "round";
      g.beginPath(); g.arc(x, y, rr * k, 0.4, 5.2); g.stroke();
    }
    if (S.layers.temp) {
      hexPath(g, x, y, rr); g.globalAlpha = 0.55; g.fillStyle = tempColor(cellTemp(c, br, maxRing)); g.fill(); g.globalAlpha = 1;
    }
  }
  // Flugloch
  const [ex, ey] = toScreen(S.grid.entrance.x, S.grid.entrance.y, "hive");
  g.fillStyle = "#0b0603"; g.fillRect(ex - 5, ey - 9, 12, 18);
  g.strokeStyle = "#e9c98b"; g.lineWidth = 1.5; g.strokeRect(ex - 5, ey - 9, 12, 18);
  S.dirty = false;
}

// [renderer] Wiese: Himmel nach Wetter, Blütenfelder mit Füllstand, Tränke, Regen
function drawMeadow(g, now) {
  const [ex, ey] = toScreen(0, 0, "out"), so = toScreen(1, 0, "out")[0] - ex;
  const x0 = ex - 4, y0 = 16, w = R.w - x0 - 12, h = R.h - 32;
  const sky = { Sonne: ["#3b2a12", "#5c4316"], "Bewölkt": ["#2b2621", "#45392b"], Regen: ["#141c24", "#25303a"] }[S.env.weather];
  const gr = g.createLinearGradient(0, y0, 0, y0 + h);
  gr.addColorStop(0, sky[0]); gr.addColorStop(1, sky[1]);
  g.fillStyle = gr; g.beginPath(); g.roundRect(x0, y0, w, h, 10); g.fill();
  g.strokeStyle = "rgba(233,201,139,.18)"; g.lineWidth = 1; g.stroke();
  g.save(); g.beginPath(); g.roundRect(x0, y0, w, h, 10); g.clip();
  g.strokeStyle = "rgba(120,140,50,.10)"; g.lineWidth = 1;
  for (let y = y0 + 20; y < y0 + h; y += 14) { g.beginPath(); g.moveTo(x0, y); g.lineTo(x0 + w, y + 6); g.stroke(); }
  if (S.env.weather === "Regen") {
    g.strokeStyle = "rgba(160,200,230,.35)";
    const t = now / 1000;
    for (let i = 0; i < 70; i++) {
      const rx = x0 + ((i * 97 + t * 40) % w), ry = y0 + ((i * 53 + t * 420) % h);
      g.beginPath(); g.moveTo(rx, ry); g.lineTo(rx - 3, ry + 10); g.stroke();
    }
  } else if (S.env.weather === "Sonne") {
    const sg = g.createRadialGradient(x0 + w - 50, y0 + 46, 4, x0 + w - 50, y0 + 46, 70);
    sg.addColorStop(0, "rgba(255,200,80,.55)"); sg.addColorStop(1, "rgba(255,200,80,0)");
    g.fillStyle = sg; g.fillRect(x0 + w - 130, y0, 130, 130);
  }
  g.restore();
  g.font = "11px SourceCode, monospace"; g.textAlign = "center";
  for (const p of S.env.patches) {
    const [px, py] = toScreen(p.u, p.v, "out"), rad = 46 * so;
    if (p.kind === "water") {
      g.fillStyle = "rgba(79,179,217,.55)"; g.beginPath(); g.ellipse(px, py, rad * 1.1, rad * 0.55, 0, 0, 7); g.fill();
      g.fillStyle = "#cfe9f3"; g.fillText(p.name, px, py + rad * 0.55 + 14); continue;
    }
    const fill = p.nectar / p.maxN, nFl = 6 + Math.round(fill * 26);
    for (let i = 0; i < nFl; i++) {
      const a = i * 2.399, d = rad * Math.sqrt((i + 0.5) / 32);
      const fx = px + Math.cos(a) * d, fy = py + Math.sin(a) * d * 0.7;
      g.fillStyle = `hsl(${p.hue},${p.hue === 0 ? 0 : 75}%,${p.hue === 0 ? 92 : 62}%)`;
      g.beginPath(); g.arc(fx, fy, 2.6, 0, 7); g.fill();
      g.fillStyle = "#ffb000"; g.beginPath(); g.arc(fx, fy, 1, 0, 7); g.fill();
    }
    // Vorratsbalken je Blütenfeld: beschriftet, mit Prozentwert
    const narrow = w < 460, bw = narrow ? 44 : 64;
    const ty = py + rad * 0.8 + 14, bx = clamp(px - bw / 2, x0 + 6, x0 + w - bw - 6);   // Balken bleibt in der Wiese
    g.font = "600 12px Fraunces, serif"; g.fillStyle = "#f2e3c6"; g.fillText(p.name, px, ty);
    g.font = "10px SourceCode, monospace";
    const labelLeft = bx + bw + (narrow ? 44 : 78) > x0 + w;   // nahe am rechten Rand: Etikett links vom Balken
    g.textAlign = labelLeft ? "right" : "left";
    [["Nektar", fill, RES_COL.nectar], ["Pollen", p.pollen / p.maxP, RES_COL.pollen]].forEach(([lab, f, col], i) => {
      const y = ty + 6 + i * 13;
      g.fillStyle = "rgba(0,0,0,.45)"; g.fillRect(bx, y, bw, 7);
      g.fillStyle = col; g.fillRect(bx, y, bw * clamp(f, 0, 1), 7);
      g.fillStyle = "rgba(242,227,198,.85)"; g.fillText(`${narrow ? lab[0] : lab} ${Math.round(f * 100)} %`, labelLeft ? bx - 5 : bx + bw + 5, y + 7);
    });
    g.textAlign = "center"; g.font = "11px SourceCode, monospace";
  }
  g.textAlign = "left"; g.fillStyle = "rgba(242,227,198,.7)";
  g.fillText(`${S.env.weather} · ${fmt(S.env.tOut, 1)} °C`, x0 + 12, y0 + 20);
}

// [renderer] interpolierte Bildschirmposition einer Biene
function beePos(b, a) {
  if (b.pspace !== b.space) return toScreen(b.x, b.y, b.space);
  return toScreen(b.px + (b.x - b.px) * a, b.py + (b.y - b.py) * a, b.space);
}

// [renderer] Pfade der Bienen (Layer)
function drawPaths(g, a) {
  g.lineWidth = 1;
  for (const b of S.bees) {
    if (!b.path.length) continue;
    g.strokeStyle = b.load ? "rgba(255,216,107,.22)" : "rgba(242,227,198,.10)";
    g.beginPath();
    const [x, y] = beePos(b, a); g.moveTo(x, y);
    for (const w of b.path) { const [wx, wy] = toScreen(w.x, w.y, w.space); g.lineTo(wx, wy); }
    g.stroke();
  }
}

// [renderer] Ressourcenflüsse (Layer): wandernde Punkte von Quelle zu Ziel
function drawFlows(g, a) {
  const life = 18;
  S.flows = S.flows.filter(f => S.tick - f.born < life);
  for (const f of S.flows) {
    const t = clamp((S.tick - f.born + a) / life, 0, 1);
    const [x0, y0] = toScreen(f.from.x, f.from.y, f.from.space), [x1, y1] = toScreen(f.to.x, f.to.y, f.to.space);
    g.strokeStyle = RES_COL[f.res]; g.globalAlpha = 0.28 * (1 - t); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    g.globalAlpha = 1 - t * 0.6; g.fillStyle = RES_COL[f.res];
    g.beginPath(); g.arc(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, 2.4, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}

// [renderer] Bienen: Körper mit Streifen, Flügel, Rollenfarbe am Kopf, Last als Punkt
function drawBees(g, a, now, reveal) {
  const k = clamp(R.cam.s * 0.32, 1.5, 3.2);
  g.globalAlpha = clamp((reveal - 0.7) / 0.3, 0, 1);
  for (const b of S.bees) {
    const [x, y] = beePos(b, a);
    const sz = b.space === "out" ? 2.4 : k;
    const ang = Math.atan2(b.y - b.py, b.x - b.px) || b.wobble;
    g.save(); g.translate(x, y); g.rotate(ang);
    const flap = Math.sin(now / 40 + b.wobble) * 0.5 + 0.5;
    g.fillStyle = "rgba(240,240,255,.45)";
    g.beginPath(); g.ellipse(-sz * 0.2, -sz * 0.9, sz * 0.9, sz * (0.35 + 0.25 * flap), -0.4, 0, 7); g.fill();
    g.fillStyle = "#f2b31f"; g.beginPath(); g.ellipse(0, 0, sz * 1.5, sz * 0.85, 0, 0, 7); g.fill();
    g.fillStyle = "#24160a"; g.fillRect(-sz * 0.5, -sz * 0.8, sz * 0.35, sz * 1.6); g.fillRect(sz * 0.15, -sz * 0.8, sz * 0.3, sz * 1.6);
    g.fillStyle = ROLE_COL[b.role]; g.beginPath(); g.arc(sz * 1.4, 0, sz * 0.5, 0, 7); g.fill();
    if (b.load) { g.fillStyle = RES_COL[b.load.res]; g.beginPath(); g.arc(-sz * 0.2, sz * 0.9, sz * 0.55, 0, 7); g.fill(); }
    g.restore();
  }
  g.globalAlpha = 1;
}

// [renderer] ein Frame
function render(a) {
  const g = R.ctx, now = performance.now();
  updateCamera();
  const reveal = clamp((now - S.revealT0 - 250) / 1500, 0, 1), eased = 1 - Math.pow(1 - reveal, 3);
  if (S.dirty || eased < 1 || R.lastComb !== S.tick) { drawComb(eased); R.lastComb = S.tick; }
  g.setTransform(R.dpr, 0, 0, R.dpr, 0, 0);
  g.clearRect(0, 0, R.w, R.h);
  g.globalAlpha = clamp((reveal - 0.45) / 0.4, 0, 1);
  drawMeadow(g, now);
  g.globalAlpha = 1;
  g.drawImage(R.comb, 0, 0, R.w, R.h);
  if (S.selected !== null) {
    const c = S.grid.cells[S.selected], [x, y] = toScreen(c.x, c.y, "hive");
    hexPath(g, x, y, CFG.HEX * R.cam.s * 1.08); g.strokeStyle = "#fff"; g.lineWidth = 2; g.stroke();
  }
  if (S.layers.paths) drawPaths(g, a);
  if (S.layers.flow) drawFlows(g, a);
  drawBees(g, a, now, reveal);
}

// [renderer] Klick auf eine Zelle -> Inspektor
function onCanvasClick(ev) {
  const r = R.cv.getBoundingClientRect();
  const w = fromScreen(ev.clientX - r.left, ev.clientY - r.top);
  const c = cellAt(w.x, w.y);
  S.selected = c ? c.id : null;
  renderInspector();
}
